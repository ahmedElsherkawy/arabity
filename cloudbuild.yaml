# Google Cloud Build Continuous Deployment Config (Triggered from GitHub `dev` branch)
steps:
  # 1. Build the container image for Arabety
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/arabety-marketplace:$COMMIT_SHA"
      - "."

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/arabety-marketplace:$COMMIT_SHA"

  # 3. Deploy container image to Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "arabety-marketplace-dev"
      - "--image"
      - "gcr.io/$PROJECT_ID/arabety-marketplace:$COMMIT_SHA"
      - "--region"
      - "europe-west1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"

images:
  - "gcr.io/$PROJECT_ID/arabety-marketplace:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
