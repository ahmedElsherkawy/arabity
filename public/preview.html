<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 md:p-6">

  <!-- Top Prototype Controller Bar -->
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 mb-5 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-orange-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          ع
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-lg text-[var(--foreground)]">Arabety | عربيتي</h1>
            <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-orange-500/15 text-orange-500 border border-orange-500/30">
              v2.0 • Store Pickup + CSV Auto-Stock + 7 Part Types
            </span>
          </div>
          <p class="text-xs text-[var(--muted-foreground)]" id="brand-subtitle">
            Multi-Trader Car Spare Parts Marketplace • Direct Store Pickup • Smart CSV Stock Verification
          </p>
        </div>
      </div>

      <!-- Global Controls -->
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="inline-flex rounded-xl border border-[var(--border)] p-1 bg-[var(--background)]">
          <button onclick="setDeviceMode('desktop')" id="btn-device-desktop" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-orange-600 text-white transition">
            💻 Web UI
          </button>
          <button onclick="setDeviceMode('mobile')" id="btn-device-mobile" class="px-3 py-1.5 rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
            📱 Mobile App UI
          </button>
        </div>

        <button onclick="toggleLocale()" class="px-3.5 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:border-orange-500 text-xs font-semibold transition flex items-center gap-1.5">
          <span>🌐</span>
          <span id="locale-label">العربية (RTL)</span>
        </button>

        <button onclick="toggleCartModal(true)" class="px-3.5 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold transition flex items-center gap-2 shadow-sm">
          <span>🛒</span>
          <span id="cart-btn-label">Cart & Pickup / Delivery</span>
          <span id="cart-count" class="px-2 py-0.5 rounded-full bg-white text-orange-700 font-bold text-xs">2</span>
        </button>
      </div>
    </div>

    <!-- Role / Screen Navigation Tabs -->
    <div class="mt-4 pt-3 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap gap-1.5" id="nav-tabs"></div>
      <div class="text-xs text-[var(--muted-foreground)] flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
        <span id="active-user-story-hint"></span>
      </div>
    </div>
  </div>

    <div id="mobile-header-bar" class="hidden bg-[var(--card)] border-b border-[var(--border)] px-5 py-2.5 rounded-t-3xl flex items-center justify-between text-xs font-semibold">
      <span>9:41</span>
      <span class="px-3 py-1 rounded-full bg-[var(--background)] border border-[var(--border)] text-xs">Arabety iOS / Android</span>

      <button onclick="setActiveTab('storefront')" class="p-1.5 rounded-xl text-xs font-medium hover:bg-[var(--background)]">
        <div>🏠</div>
        <div>Shop</div>
      </button>

        <div>RFQ</div>

        <div>Workshops</div>

    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-2xl w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-4 pb-3 border-b border-[var(--border)]">
        <div>
          <span class="text-xs font-semibold text-orange-500 uppercase" id="modal-part-oe"></span>
          <h3 class="text-base font-bold text-[var(--foreground)] mt-0.5" id="modal-part-title"></h3>
        </div>
        <button onclick="closeOffersModal()" class="px-2.5 py-1 rounded-lg border border-[var(--border)] text-xs font-semibold hover:bg-[var(--background)]">✕</button>
      </div>
      <div id="modal-offers-list" class="space-y-3 mt-4"></div>
    </div>
  </div>

    // CSV Upload, Parse, Verify & Auto-Add Functions
    function handleCsvFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        state.csvRawText = e.target.result;
        loadSampleCsvAndVerify();
      };
      reader.readAsText(file);
    }

    function loadSampleCsvAndVerify() {
      const textarea = document.getElementById('csv-textarea');
      if (textarea) {
        state.csvRawText = textarea.value;
      }
      const lines = state.csvRawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length <= 1) return;

      const validPartTypes = PART_TYPES.map(x => x.id);
      const validConds = PART_CONDITIONS.map(x => x.id);

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        const oeNumber = cols[0] || '';
        const nameEn = cols[1] || 'Unnamed Part';
        const nameAr = cols[2] || nameEn;
        const partType = validPartTypes.includes(cols[3]) ? cols[3] : 'MECHANICAL_ENGINE';
        const condition = validConds.includes(cols[4]) ? cols[4] : 'OEM_NEW';
        const brand = cols[5] || 'OEM';
        const origin = cols[6] || 'Japan';
        const price = Number(cols[7]) || 0;
        const stockQty = Number(cols[8]) || 0;
        const warrantyDays = Number(cols[9]) || 30;
        const allowStorePickup = (cols[10] || 'YES').toUpperCase() === 'YES';

        const existsInCatalog = state.parts.some(p => p.oeNumber.toLowerCase() === oeNumber.toLowerCase());
        const isValid = Boolean(oeNumber && nameEn && price > 0 && stockQty > 0);

        rows.push({
          oeNumber,
          nameEn,
          nameAr,
          partType,
          condition,
          brand,
          origin,
          price,
          stockQty,
          warrantyDays,
          allowStorePickup,
          isValid,
          selected: isValid,
          statusEn: !isValid
            ? 'Invalid Price or Missing Data (Auto-Skipped)'
            : existsInCatalog
              ? 'Matched Existing Catalog OE#'
              : 'Verified — New Catalog Part',
          statusAr: !isValid
            ? 'سعر غير صالح أو بيانات ناقصة (تم استبعاده)'
            : existsInCatalog
              ? 'متطابق مع رقم أصلي موجود بالكتالوج'
              : 'تم التحقق — قطعة جديدة صالحة للإضافة'
        });
      }

      state.csvVerifiedRows = rows;
      state.csvHasParsed = true;
      state.csvAutoAddSuccessBanner = null;
      renderAll();
    }

    function toggleCsvRowSelection(idx, checked) {
      if (state.csvVerifiedRows[idx]) {
        state.csvVerifiedRows[idx].selected = checked;
        renderAll();
      }
    }

    function confirmAndAutoAddCsvStock() {
      const toAdd = state.csvVerifiedRows.filter(r => r.isValid && r.selected);
      if (toAdd.length === 0) return;

      toAdd.forEach(item => {
        const existing = state.parts.find(p => p.oeNumber.toLowerCase() === item.oeNumber.toLowerCase());
        const newOffer = {
          id: 'o-csv-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          traderEn: 'El-Tawfikia Auto Parts',
          traderAr: 'التوفيقية لقطع غيار السيارات',
          storeAddressEn: 'Downtown Cairo — 14 Orabi St, El-Tawfikia',
          storeAddressAr: 'وسط البلد — 14 شارع عرابي، التوفيقية',
          allowStorePickup: item.allowStorePickup,
          pickupReadyMins: 30,
          rating: 4.9,
          condition: item.condition,
          brandEn: item.brand,
          brandAr: item.brand,
          originEn: item.origin,
          originAr: item.origin,
          price: item.price,
          stock: item.stockQty,
          warrantyDays: item.warrantyDays,
          shipHours: 12
        };

        if (existing) {
          existing.offers.unshift(newOffer);
          existing.isFromCsv = true;
        } else {
          state.parts.unshift({
            id: 'p-csv-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            oeNumber: item.oeNumber,
            nameEn: item.nameEn,
            nameAr: item.nameAr,
            partType: item.partType,
            compatibleVehicles: ['v-corolla-22', 'ALL'],
            isFromCsv: true,
            offers: [newOffer]
          });
        }
      });

      state.csvHasParsed = false;
      state.csvAutoAddSuccessBanner = t(
        `✅ Confirmed! ${toAdd.length} verified spare parts from your CSV were automatically added to your inventory and are now live in the Storefront!`,
        `✅ تم التأكيد! تمت إضافة ${toAdd.length} قطع غيار من ملف الـ CSV تلقائياً إلى مخزونك وهي متاحة الآن للعملاء في المتجر!`
      );
      renderAll();
    }

      const condition = document.getElementById('man-cond').value || 'OEM_NEW';
      const brand = document.getElementById('man-brand').value || 'Aisin Japan';
      const price = Number(document.getElementById('man-price').value) || 2250;
      const stock = Number(document.getElementById('man-qty').value) || 5;
      const allowStorePickup = document.getElementById('man-pickup').value === 'YES';

      state.parts.unshift({
        id: 'p-man-' + Date.now(),
        oeNumber,
        nameEn,
        nameAr,
        partType,
        compatibleVehicles: ['v-corolla-22', 'ALL'],
        isFromCsv: true,
        offers: [
          {
            id: 'o-man-' + Date.now(),
            traderEn: 'El-Tawfikia Auto Parts',
            traderAr: 'التوفيقية لقطع غيار السيارات',
            storeAddressEn: 'Downtown Cairo — 14 Orabi St, El-Tawfikia',
            storeAddressAr: 'وسط البلد — 14 شارع عرابي، التوفيقية',
            allowStorePickup,
            pickupReadyMins: 30,
            rating: 4.9,
            condition,
            brandEn: brand,
            brandAr: brand,
            originEn: 'Japan',
            originAr: 'اليابان',
            price,
            stock,
            warrantyDays: 90,
            shipHours: 12
          }
        ]
      });

      state.csvAutoAddSuccessBanner = t(
        `✅ "${nameEn}" (OE# ${oeNumber}) has been added to your live inventory!`,
        `✅ تمت إضافة "${nameAr}" (OE# ${oeNumber}) إلى مخزونك الحي بنجاح!`
      );
      renderAll();
    }

    function changeGarageVehicle(val) {
      state.selectedVehicleId = val;
      renderAll();
    }

    function setPartTypeFilter(typeId) {
      state.partTypeFilter = typeId;
      renderAll();
    }

    function toggleOnlyStorePickup() {
      state.onlyStorePickup = !state.onlyStorePickup;
      renderAll();
    }

    function updateSearch(val) {
      state.searchQuery = val;
      renderAll();
    }

    function setConditionFilter(cond) {
      state.conditionFilter = cond;
      renderAll();
    }

    function openOffersModal(partId) {
      const part = state.parts.find(p => p.id === partId);
      if (!part) return;
      document.getElementById('modal-part-oe').textContent = `OE# ${part.oeNumber} • ${getPartTypeLabel(part.partType)}`;
      document.getElementById('modal-part-title').textContent = t(part.nameEn, part.nameAr);

      const listEl = document.getElementById('modal-offers-list');
      listEl.innerHTML = part.offers.map((o, idx) => `
        <div class="p-4 rounded-xl bg-[var(--background)] border ${idx === 0 ? 'border-orange-500' : 'border-[var(--border)]'} flex flex-wrap items-center justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-[var(--foreground)]">${t(o.traderEn, o.traderAr)}</span>
              <span class="text-xs text-amber-500 font-semibold">⭐ ${o.rating}</span>
              ${conditionBadge(o.condition)}
            </div>
            <div class="text-xs font-semibold text-[var(--foreground)]">
              ${t(o.brandEn, o.brandAr)} — ${t('Origin:', 'المنشأ:')} ${t(o.originEn, o.originAr)}
            </div>
            ${o.allowStorePickup ? `
              <div class="text-xs text-emerald-500 font-semibold">
                🏪 ${t(`Direct Store Pickup Ready in ${o.pickupReadyMins} mins:`, `متاح استلام مباشر من المحل خلال ${o.pickupReadyMins} د:`)} ${t(o.storeAddressEn, o.storeAddressAr)}
              </div>
            ` : ''}
          </div>
          <div class="text-end space-y-1.5">
            <div class="text-lg font-extrabold text-orange-500">${o.price.toLocaleString()} EGP</div>
            <div class="flex gap-1.5">
              ${o.allowStorePickup ? `
                <button onclick="addToCart('${part.id}', '${o.id}', 'STORE_PICKUP'); closeOffersModal();" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition">
                  🏪 ${t('Pick Up at Store', 'استلام من المحل')}
                </button>
              ` : ''}
              <button onclick="addToCart('${part.id}', '${o.id}', 'HOME'); closeOffersModal();" class="px-3 py-1.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold transition">
                🚚 ${t('Deliver', 'شحن')}
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('offers-modal').classList.remove('hidden');
    }

    function closeOffersModal() {
      document.getElementById('offers-modal').classList.add('hidden');
    }

    function addToCart(partId, offerId, preferredMode) {
      const part = state.parts.find(p => p.id === partId);
      if (!part) return;
      const offer = part.offers.find(o => o.id === offerId) || part.offers[0];
      state.cart.push({
        partId: part.id,
        partNameEn: part.nameEn,
        partNameAr: part.nameAr,
        oeNumber: part.oeNumber,
        traderNameEn: offer.traderEn,
        traderNameAr: offer.traderAr,
        storeAddressEn: offer.storeAddressEn || 'Downtown Cairo — El-Tawfikia',
        storeAddressAr: offer.storeAddressAr || 'وسط البلد — التوفيقية',
        allowStorePickup: offer.allowStorePickup !== false,
        pickupReadyMins: offer.pickupReadyMins || 30,
        condition: offer.condition,
        brand: t(offer.brandEn, offer.brandAr),
        price: offer.price,
        qty: 1
      });
      if (preferredMode) {
        state.deliveryMode = preferredMode;
      }
      state.orderSuccessData = null;
      renderAll();
      toggleCartModal(true);
    }

    function submitNewRFQ() {
      const veh = document.getElementById('rfq-vehicle').value || '2022 Toyota Corolla';
      const partName = document.getElementById('rfq-partname').value || 'Front Bumper Reinforcement Bar';

      state.rfqs.unshift({
        id: 'RFQ-' + Math.floor(8900 + Math.random() * 900),
        vehicleEn: veh,
        vehicleAr: veh,
        vin: 'JTDBR32E800192831',
        partNameEn: partName,
        partNameAr: partName,
        status: 'QUOTED',
        quotes: [
          {
            id: 'q-auto-' + Date.now(),
            traderEn: 'El-Tawfikia Auto Parts',
            traderAr: 'التوفيقية لقطع غيار السيارات',
            condition: 'AFTERMARKET_COMMERCIAL',
            brand: 'Certified Taiwan Grade-1',
            price: 2400,
            warrantyDays: 60,
            notesEn: 'Ready for immediate In-Store Pickup at our El-Tawfikia shop or same-day courier.',
            notesAr: 'جاهز للاستلام الفوري من محلنا بالتوفيقية أو الشحن السريع.'
          }
        ]
      });
      renderAll();
    }

    function acceptRFQQuote(rfqId, quoteId) {
      const rfq = state.rfqs.find(r => r.id === rfqId);
      if (!rfq) return;
      const q = rfq.quotes.find(x => x.id === quoteId);
      if (!q) return;
      state.cart.push({
        partId: rfq.id,
        partNameEn: rfq.partNameEn,
        partNameAr: rfq.partNameAr,
        oeNumber: 'RFQ-CUSTOM',
        traderNameEn: q.traderEn,
        traderNameAr: q.traderAr,
        storeAddressEn: 'Downtown Cairo — 14 Orabi St, El-Tawfikia',
        storeAddressAr: 'وسط البلد — 14 شارع عرابي، التوفيقية',
        allowStorePickup: true,
        pickupReadyMins: 30,
        condition: q.condition,
        brand: q.brand,
        price: q.price,
        qty: 1
      });
      renderAll();
      toggleCartModal(true);
    }

    function selectWorkshopForCheckout(wsId) {
      state.selectedWorkshopId = wsId;
      state.deliveryMode = 'WORKSHOP';
      renderAll();
      toggleCartModal(true);
    }

    function toggleCartModal(open) {
      const modal = document.getElementById('cart-modal');
      if (!open) {
        modal.classList.add('hidden');
        return;
      }
      renderCartModalBody();
      modal.classList.remove('hidden');
    }

    function setDeliveryMode(mode) {
      state.deliveryMode = mode;
      renderCartModalBody();
    }

    function removeCartIdx(idx) {
      state.cart.splice(idx, 1);
      renderAll();
      renderCartModalBody();
    }

    function completeCheckout() {
      const pickupCode = 'PK-' + Math.floor(1000 + Math.random() * 9000);
      const firstItem = state.cart[0] || {};
      state.orderSuccessData = {
        mode: state.deliveryMode,
        orderNo: 'ARB-' + Math.floor(90000 + Math.random() * 9000),
        pickupCode,
        traderName: t(firstItem.traderNameEn || 'El-Tawfikia Auto Parts', firstItem.traderNameAr || 'التوفيقية لقطع الغيار'),
        storeAddress: t(firstItem.storeAddressEn || 'Downtown Cairo — 14 Orabi St', firstItem.storeAddressAr || 'وسط البلد — 14 شارع عرابي، التوفيقية')
      };
      state.cart = [];
      renderAll();
      renderCartModalBody();
    }

    function renderCartModalBody() {
      document.getElementById('cart-modal-title').textContent = t('Checkout: Direct Store Pickup, Home Delivery, or Workshop Install', 'إتمام الطلب: استلام مباشر من المحل أو توصيل للمنزل أو لمركز الصيانة');
      const body = document.getElementById('cart-modal-body');

      if (state.orderSuccessData) {
        const d = state.orderSuccessData;
        body.innerHTML = `
          <div class="p-4 rounded-2xl bg-emerald-500/15 border-2 border-emerald-500 space-y-2 text-xs">
            <div class="text-sm font-extrabold text-emerald-500">
              🎉 ${t(`Order #${d.orderNo} Confirmed!`, `تم تأكيد الطلب #${d.orderNo} بنجاح!`)}
            </div>
            ${d.mode === 'STORE_PICKUP' ? `
              <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-1">
                <div class="font-bold text-[var(--foreground)]">🏪 ${t('Direct Store Pickup Pass (Ready in 30 mins):', 'كود الاستلام المباشر من محل التاجر (جاهز خلال 30 دقيقة):')}</div>
                <div class="text-lg font-mono font-extrabold text-orange-500">${d.pickupCode}</div>
                <div class="text-[var(--muted-foreground)]">📍 ${t('Pickup Store:', 'عنوان المحل:')} <strong>${d.traderName} — ${d.storeAddress}</strong></div>
                <div class="text-[var(--muted-foreground)]">${t('Show this code to the trader to inspect & collect your spare part with 0 EGP shipping.', 'أظهر هذا الكود للتاجر لمعاينة واستلام القطعة مباشرة بدون مصاريف شحن.')}</div>
              </div>
            ` : `
              <div class="text-[var(--foreground)] font-semibold">
                ${t('Your sub-orders have been dispatched and protected by Arabety Fitment Escrow.', 'تم إرسال طلبك للتاجر وهو محمي بضمان التوافق من عربيتي.')}
              </div>
            `}
          </div>
        `;
        return;
      }

      if (state.cart.length === 0) {
        body.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] py-6 text-center">${t('Your cart is empty.', 'سلة المشتريات فارغة.')}</div>`;
        return;
      }

      const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = state.deliveryMode === 'STORE_PICKUP' ? 0 : 85;
      const ws = state.workshops.find(w => w.id === state.selectedWorkshopId) || state.workshops[0];
      const installFee = state.deliveryMode === 'WORKSHOP' ? ws.installFee : 0;
      const total = subtotal + shipping + installFee;

      body.innerHTML = `
        <div class="space-y-2.5">
          ${state.cart.map((item, idx) => `
            <div class="p-3 rounded-xl bg-[var(--background)] border border-[var(--border)] flex items-center justify-between gap-2">
              <div>
                <div class="text-xs font-bold text-[var(--foreground)]">${t(item.partNameEn, item.partNameAr)}</div>
                <div class="text-xs text-[var(--muted-foreground)]">
                  ${t('Trader:', 'التاجر:')} <strong>${t(item.traderNameEn, item.traderNameAr)}</strong> • ${item.brand}
                </div>
                <div class="text-xs text-emerald-500">
                  📍 ${t(item.storeAddressEn, item.storeAddressAr)}
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs font-extrabold text-orange-500">${item.price.toLocaleString()} EGP</span>
                <button onclick="removeCartIdx(${idx})" class="text-xs text-red-500 font-bold">✕</button>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- 3-Way Fulfillment Switcher -->
        <div class="p-3.5 rounded-xl bg-[var(--background)] border border-[var(--border)] space-y-2.5">
          <div class="text-xs font-bold text-[var(--foreground)]">${t('Choose How You Want to Receive Your Spare Parts (3 Options):', 'اختر طريقة استلام قطع الغيار (3 خيارات متاحة):')}</div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <button onclick="setDeliveryMode('STORE_PICKUP')" class="p-2.5 rounded-xl border text-start text-xs transition ${
              state.deliveryMode === 'STORE_PICKUP' ? 'border-emerald-500 bg-emerald-500/10 font-bold' : 'border-[var(--border)]'
            }">
              <div>🏪 ${t('Pick Up from Trader Store', 'استلام مباشر من محل التاجر')}</div>
              <div class="text-emerald-500 font-semibold mt-0.5">${t('FREE (0 EGP) • Ready 30m', 'مجاناً (0 ج.م) • جاهز خلال 30 د')}</div>
            </button>
            <button onclick="setDeliveryMode('HOME')" class="p-2.5 rounded-xl border text-start text-xs transition ${
              state.deliveryMode === 'HOME' ? 'border-orange-500 bg-orange-500/10 font-bold' : 'border-[var(--border)]'
            }">
              <div>🏠 ${t('Deliver to Home Address', 'توصيل للمنزل')}</div>
              <div class="text-[var(--muted-foreground)] mt-0.5">${t('+85 EGP Fast Courier', '+85 ج.م شحن سريع')}</div>
            </button>
            <button onclick="setDeliveryMode('WORKSHOP')" class="p-2.5 rounded-xl border text-start text-xs transition ${
              state.deliveryMode === 'WORKSHOP' ? 'border-orange-500 bg-orange-500/10 font-bold' : 'border-[var(--border)]'
            }">
              <div>🔧 ${t('Ship to Workshop + Install', 'شحن لمركز صيانة + تركيب')}</div>
              <div class="text-[var(--muted-foreground)] mt-0.5">${t(`+${ws.installFee} EGP Labor`, `+${ws.installFee} ج.م مصنعية`)}</div>
            </button>
          </div>

          ${state.deliveryMode === 'STORE_PICKUP' ? `
            <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-500 font-semibold">
              ✓ ${t('Direct Store Pickup Selected: Your part is reserved at the trader counter. You will receive an instant Pickup Code to collect it directly from:', 'تم اختيار الاستلام المباشر من المحل: سيتم حجز القطعة باسمك وإصدار كود استلام فوري من عنوان التاجر:')}
              <strong class="block text-[var(--foreground)] mt-0.5">📍 ${t(state.cart[0].storeAddressEn, state.cart[0].storeAddressAr)}</strong>
            </div>
          ` : ''}
        </div>

        <!-- Summary -->
        <div class="p-3.5 rounded-xl bg-[var(--background)] border border-[var(--border)] space-y-1.5 text-xs">
          <div class="flex justify-between"><span>${t('Parts Subtotal:', 'إجمالي قطع الغيار:')}</span><strong>${subtotal.toLocaleString()} EGP</strong></div>
          <div class="flex justify-between">
            <span>${t('Shipping / Pickup Fee:', 'رسوم الشحن أو الاستلام من المحل:')}</span>
            <strong class="${shipping === 0 ? 'text-emerald-500' : ''}">${shipping === 0 ? t('0 EGP (Free Store Pickup)', '0 ج.م (استلام مباشر من المحل)') : `${shipping} EGP`}</strong>
          </div>
          ${installFee > 0 ? `<div class="flex justify-between text-emerald-500"><span>${t('Workshop Installation Fee:', 'مصنعية التركيب في المركز:')}</span><strong>+${installFee} EGP</strong></div>` : ''}
          <div class="flex justify-between pt-2 border-t border-[var(--border)] text-sm font-extrabold text-orange-500">
            <span>${t('Total Amount:', 'الإجمالي النهائي:')}</span>
            <span>${total.toLocaleString()} EGP</span>
          </div>
        </div>

        <button onclick="completeCheckout()" class="w-full py-3 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold transition shadow-sm">
          ${state.deliveryMode === 'STORE_PICKUP'
            ? t('✓ Confirm Reservation & Get Store Pickup Code', '✓ تأكيد الحجز وإصدار كود الاستلام من محل التاجر')
            : t('✓ Confirm Order & Reserve Fitment Guarantee', '✓ تأكيد الطلب وتفعيل ضمان التوافق')}
        </button>
      `;
    }

    function renderAll() {
      renderNavTabs();
      const container = document.getElementById('screen-container');
      if (state.activeTab === 'storefront') container.innerHTML = renderStorefront();
      else if (state.activeTab === 'trader-stock') container.innerHTML = renderTraderStockPage();
      else if (state.activeTab === 'rfq') container.innerHTML = renderRFQScreen();
      else if (state.activeTab === 'workshops') container.innerHTML = renderWorkshopsScreen();
      else if (state.activeTab === 'admin') container.innerHTML = renderAdminScreen();
    }

    // Parse initial CSV on load so the verification table is ready to inspect immediately
    loadSampleCsvAndVerify();
  </script>
</body>
</html>
