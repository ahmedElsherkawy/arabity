    <div class="flex flex-wrap items-center justify-between gap-4">
      <!-- Brand Identity -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-orange-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          ع
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-lg text-[var(--foreground)]">Arabety | عربيتي</h1>
            <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-orange-500/15 text-orange-500 border border-orange-500/30" id="flow-stage-badge">
              Full Flow: Auth → Garage → Shop / CSV Stock → Checkout → Pickup / Tracking
            </span>
          </div>
          <p class="text-xs text-[var(--muted-foreground)]" id="brand-subtitle">
            Complete Car Spare Parts Marketplace • Login/Sign-Up to Order Handover
          </p>
        </div>
      </div>

      <!-- Controls: Device Mode + Language + User Session Pill -->
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="inline-flex rounded-xl border border-[var(--border)] p-1 bg-[var(--background)]">
          <button onclick="setDeviceMode('desktop')" id="btn-device-desktop" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-orange-600 text-white transition">
            💻 Web UI
          </button>
          <button onclick="setDeviceMode('mobile')" id="btn-device-mobile" class="px-3 py-1.5 rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
            📱 Mobile App
          </button>
        </div>

        <button onclick="toggleLocale()" class="px-3.5 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:border-orange-500 text-xs font-semibold transition flex items-center gap-1.5">
          <span>🌐</span>
          <span id="locale-label">العربية (RTL)</span>
        </button>

        <div id="session-pill-container"></div>
      </div>
    </div>

    <!-- End-to-End Journey Stepper Bar -->

          name: t('El-Tawfikia Auto Parts', 'التوفيقية لقطع غيار السيارات'),

          role: 'TRADER',

      state.currentUser = userObj;

          part.nameEn.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
          part.nameAr.includes(state.searchQuery) ||
          part.oeNumber.toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchesType = state.partTypeFilter === 'ALL' || part.partType === state.partTypeFilter;
        const matchesCondition = state.conditionFilter === 'ALL' || part.offers.some(o => o.condition === state.conditionFilter);

        return matchesSearch && matchesType && matchesCondition && matchesPickup;
      });

      return `
        <!-- Sticky My Garage + Store Pickup Filter Bar -->

    // CSV & Stock Action Helpers
    function handleCsvFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        state.csvRawText = e.target.result;
        loadSampleCsvAndVerify();
      };
      reader.readAsText(file);
    }

    function loadSampleCsvAndVerify() {
      const textarea = document.getElementById('csv-textarea');
      if (textarea) state.csvRawText = textarea.value;
      const lines = state.csvRawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length <= 1) return;

      const validPartTypes = PART_TYPES.map(x => x.id);
      const validConds = PART_CONDITIONS.map(x => x.id);

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        const oeNumber = cols[0] || '';
        const nameEn = cols[1] || 'Unnamed Part';
        const nameAr = cols[2] || nameEn;
        const partType = validPartTypes.includes(cols[3]) ? cols[3] : 'MECHANICAL_ENGINE';
        const condition = validConds.includes(cols[4]) ? cols[4] : 'OEM_NEW';
        const brand = cols[5] || 'OEM';
        const origin = cols[6] || 'Japan';
        const price = Number(cols[7]) || 0;
        const stockQty = Number(cols[8]) || 0;
        const warrantyDays = Number(cols[9]) || 30;
        const allowStorePickup = (cols[10] || 'YES').toUpperCase() === 'YES';
        const isValid = Boolean(oeNumber && nameEn && price > 0 && stockQty > 0);

        rows.push({
          oeNumber, nameEn, nameAr, partType, condition, brand, origin, price, stockQty, warrantyDays, allowStorePickup,
          isValid, selected: isValid
        });
      }
      state.csvVerifiedRows = rows;
      state.csvHasParsed = true;
      renderAll();
    }

        partNameEn: partName, partNameAr: partName, status: 'QUOTED',
        quotes: [{
          id: 'q-auto-' + Date.now(),
          traderEn: 'El-Tawfikia Auto Parts', traderAr: 'التوفيقية لقطع غيار السيارات',
          condition: 'AFTERMARKET_COMMERCIAL', brand: 'Certified Taiwan Grade-1', price: 2400, warrantyDays: 60,
          notesEn: 'Ready for immediate In-Store Pickup at El-Tawfikia or courier delivery.',
          notesAr: 'جاهز للاستلام الفوري من محلنا بالتوفيقية أو الشحن السريع.'
        }]
      });
      renderAll();
    }

    function acceptRFQQuote(rfqId, quoteId) {
      const rfq = state.rfqs.find(r => r.id === rfqId);
      if (!rfq) return;
      const q = rfq.quotes.find(x => x.id === quoteId);
      if (!q) return;
      state.cart.push({
        partId: rfq.id, partNameEn: rfq.partNameEn, partNameAr: rfq.partNameAr, oeNumber: 'RFQ-CUSTOM',
        traderNameEn: q.traderEn, traderNameAr: q.traderAr,
        storeAddressEn: 'Downtown Cairo — 14 Orabi St, El-Tawfikia',
        storeAddressAr: 'وسط البلد — 14 شارع عرابي، التوفيقية',
        allowStorePickup: true, pickupReadyMins: 30, condition: q.condition, brand: q.brand, price: q.price, qty: 1
      });
      state.activeTab = 'checkout';
      renderAll();
    }

    function renderAll() {
      renderHeaderAndStepper();
      const container = document.getElementById('screen-container');
      if (state.activeTab === 'auth') container.innerHTML = renderAuthScreen();
      else if (state.activeTab === 'garage-onboarding') container.innerHTML = renderGarageOnboarding();
      else if (state.activeTab === 'storefront') container.innerHTML = renderStorefront();
      else if (state.activeTab === 'trader-stock') container.innerHTML = renderTraderStockPage();
      else if (state.activeTab === 'rfq') container.innerHTML = renderRFQScreen();
      else if (state.activeTab === 'checkout') container.innerHTML = renderCheckoutScreen();
      else if (state.activeTab === 'my-orders') container.innerHTML = renderMyOrdersScreen();
      else container.innerHTML = renderStorefront();
    }

    renderAll();
  </script>
</body>
</html>
